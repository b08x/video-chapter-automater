[build-system]
requires = [ "hatchling", "hatch-vcs" ]
build-backend = "hatchling.build"


[project]
name = "video-chapter-automater"
description = "Automatic video chapter generation using scene detection"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: End Users/Desktop",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.8",
"Programming Language :: Python :: 3.9",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: Multimedia :: Video",
"Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.8.0",
    "scenedetect>=0.6.0",
    "opencv-python-headless>=4.6.0",
    "imagehash>=4.3.0",
    "Pillow>=9.0.0",
    "intel-extension-for-pytorch>=2.8.0",
]
dynamic = [ "version" ]


[[project.authors]]
name = "Video Chapter Automater Team"


[project.license]
text = "MIT"


[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0", 
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0"
]
# GPU acceleration dependencies
gpu = [
]
# NVIDIA GPU specific
nvidia = [
    "video-chapter-automater[gpu]",
    "nvidia-ml-py>=11.0.0"
]
# Intel GPU specific  
intel = [
    "video-chapter-automater[gpu]",
    "intel-extension-for-pytorch"
]
# Docker container dependencies
docker = [
    "video-chapter-automater[gpu]"
]
# Full installation with all features
all = [
    "video-chapter-automater[gpu,nvidia,dev]"
]


[project.urls]
Homepage = "https://github.com/your-org/video-chapter-automater"
Repository = "https://github.com/your-org/video-chapter-automater"
Issues = "https://github.com/your-org/video-chapter-automater/issues"


[project.scripts]
video-chapter-automater = "video_chapter_automater.cli:main"
vca = "video_chapter_automater.cli:main"
vca-pipeline = "video_chapter_automater.cli_pipeline:main"
video-chapter-setup = "video_chapter_automater.setup_wizard:main"


[tool.hatch.version]
source = "vcs"


[tool.hatch.build.targets.wheel]
packages = [ "src/video_chapter_automater" ]


[tool.hatch.build.targets.sdist]
include = [ "/src", "/tests", "/README.md", "/LICENSE" ]


[tool.black]
line-length = 88
target-version = [ "py38" ]
include = "\\.pyi?$"
extend-exclude = """
/(
# directories
\\.eggs
| \\.git
| \\.hg
| \\.mypy_cache
| \\.tox
| \\.venv
| build
| dist
)/
"""


[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = [ "video_chapter_automater" ]


[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


[[tool.mypy.overrides]]
module = [ "scenedetect.*" ]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [ "tests" ]
markers = [
"slow: marks tests as slow (deselect with '-m \"not slow\"')",
"gpu: marks tests that require GPU hardware"
]


[tool.coverage.run]
source = [ "src" ]
omit = [ "*/tests/*", "*/test_*.py" ]


[tool.coverage.report]
exclude_lines = [
"pragma: no cover",
"def __repr__",
"if self.debug:",
"if settings.DEBUG",
"raise AssertionError",
"raise NotImplementedError",
"if 0:",
"if __name__ = = .__main__.:",
"class .*\\bProtocol\\):",
"@(abc\\.)?abstractmethod"
]
