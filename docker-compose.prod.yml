# Production Docker Compose override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  video-chapter-automater:
    # Production optimizations
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute]
    
    # Production security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=1g
      - /var/tmp:noexec,nosuid,size=512m
    
    # Production volumes (read-only where possible)
    volumes:
      - /production/videos:/data:ro
      - /production/output:/output:rw
      - /production/logs:/app/logs:rw
    
    # Production environment
    environment:
      - PYTHONUNBUFFERED=1
      - UV_CACHE_DIR=/tmp/uv-cache
      - CUDA_VISIBLE_DEVICES=0  # Use first GPU only
      - FORCE_CPU=false
      - LOG_LEVEL=INFO
      - WORKERS=4
    
    # Health check for production monitoring
    healthcheck:
      test: ["CMD", "python", "-m", "video_chapter_automater.cli", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Remove development services in production
  dev:
    profiles: ["dev"]
  
  gpu-test:
    profiles: ["dev"]